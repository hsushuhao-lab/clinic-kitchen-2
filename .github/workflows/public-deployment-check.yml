name: Public game verification
on:
  workflow_run:
    workflows: ['Runtime-only web release audit']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Chromium
        run: |
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Verify live R11 source SHA and runtime files
        run: python tools/verify_public_build.py --url https://hsushuhao-lab.github.io/clinic-kitchen-2/ --expect-sha $(git rev-parse HEAD)
      - name: Play published R11 M1 kitchen flow
        run: python tests/test_r11_flow.py --base-url https://hsushuhao-lab.github.io/clinic-kitchen-2/ --output qa/public-r11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-r11-game-evidence
          path: qa/public-r11/
          retention-days: 14