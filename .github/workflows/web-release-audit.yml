name: Runtime-only web release audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_web_release.py'
      - '.github/workflows/web-release-audit.yml'
      - 'index.html'
      - '*.css'
      - 'src/**'
      - 'assets/models/**'
      - 'assets/cooking/**'
      - 'assets/ingredients/**'
      - 'assets/ui/**'
      - 'assets/art_direction/approved/**'
      - 'tests/test_flat_clinic.py'
      - 'tools/build_flat_release.py'
      - 'tools/build_flat_portraits.py'
      - 'tests/shift_rules.test.cjs'
      - 'tools/verify_shift_assets.py'
      - 'tools/build_character_portraits.py'
      - 'tools/verify_character_assets.py'
      - 'tests/test_character_art.py'
      - 'tools/build_workspace_art.py'
      - 'tools/verify_workspace_art.py'
      - 'tests/test_workspace_visuals.py'
      - 'tools/build_chibi_world.py'
      - 'tools/chibi_*.py'
      - 'tools/verify_chibi_world.py'
      - 'tests/test_chibi_world.py'
      - 'tests/rush_rules.test.cjs'
      - 'tests/test_rush_game.py'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  package-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: |
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Validate source and create strictly allowlisted release
        run: |
          python tests/smoke_test.py
          python tools/verify_assets.py
          python tools/verify_shift_assets.py
          node --test tests/shift_rules.test.cjs
          python tools/build_web_release.py
      - name: Test runtime-only HTTP root
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory web-dist > /tmp/ck-release-http.log 2>&1 &
          sleep 2
          python tests/test_flat_clinic.py --base-url http://127.0.0.1:8000/ --output qa/current/flat
          python tests/test_character_art.py --base-url http://127.0.0.1:8000/ --output qa/current/characters
          python tests/test_workspace_visuals.py --base-url http://127.0.0.1:8000/ --output qa/current/workspace
          python tests/test_chibi_world.py --base-url http://127.0.0.1:8000/ --output qa/current/chibi
          python tests/test_rush_game.py --base-url http://127.0.0.1:8000/ --output qa/current/rush --preview
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError
          for path in ['.git/config', '.env', 'README.md', 'docs/AGENT_PROMPT.md', 'assets/manifest.json', 'assets/art_direction/approved/doctor_concepts.png']:
              try:
                  urlopen('http://127.0.0.1:8000/' + path)
              except HTTPError as e:
                  assert e.code == 404, (path, e.code)
              else:
                  raise AssertionError('Non-runtime path was served: ' + path)
          print('Release privacy smoke: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-kitchen-web-runtime
          path: web-dist/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinic-kitchen-release-audit
          path: qa/current/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-kitchen-verification-scripts
          path: tests/
          retention-days: 14
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist/
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
