name: Runtime-only web release audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/**'
      - 'index.html'
      - '*.css'
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: |
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Build and validate R10 runtime
        run: |
          python tests/smoke_test.py
          python tools/verify_assets.py
          python tools/verify_shift_assets.py
          python tools/build_web_release.py
      - name: Test runtime-only R10 kitchen flow
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory web-dist > /tmp/ck-r10-release-http.log 2>&1 &
          sleep 2
          python tests/test_r10_flow.py --base-url http://127.0.0.1:8000/ --output qa/current/r10
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError
          for path in ['.git/config','.env','README.md','docs/AGENT_PROMPT.md','assets/manifest.json']:
              try:
                  urlopen('http://127.0.0.1:8000/'+path)
              except HTTPError as e:
                  assert e.code==404,(path,e.code)
              else:
                  raise AssertionError('Non-runtime path was served: '+path)
          print('R10 release privacy smoke: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-kitchen-r10-runtime
          path: web-dist/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinic-kitchen-r10-audit
          path: qa/current/
          retention-days: 14
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist/
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
