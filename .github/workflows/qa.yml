name: Clinic Kitchen QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: |
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Validate R11 source, rules and assets
        run: |
          python tests/smoke_test.py
          python tools/verify_assets.py
          python tools/verify_shift_assets.py
          python tools/build_web_release.py
      - name: Play R11 M4 kitchen flow
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory web-dist > /tmp/ck-r11-http.log 2>&1 &
          sleep 2
          python tests/test_r11_flow.py --base-url http://127.0.0.1:8000/ --output qa/current/r11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ck-r11-browser-evidence
          path: qa/current/r11/
          retention-days: 14