<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Craving Kitchen R9</title>
<link rel="stylesheet" href="r9.css?v=r9-clean-1">
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand"><span class="brand-mark">🍳</span><div><strong>CRAVING KITCHEN</strong><small>R9 · CLEAN CLINIC FLOW</small></div></div>
  <div class="ticket-box"><span>NOW SERVING</span><strong id="ticketNumber">001</strong></div>
</header>
<aside id="patientPanel" aria-label="病人臨床資訊">
  <section class="patient-card">
    <div class="patient-portrait-wrap"><img id="patientPortrait" src="" alt=""></div>
    <h2 id="patientName">病人</h2>
    <blockquote id="patientComplaint"></blockquote>
  </section>
  <section class="ftnd-card">
    <div class="section-title"><strong>FTND BASELINE</strong><small>唯讀，不因料理改變</small></div>
    <div class="ftnd-main"><strong id="ftndScore">-</strong><span>/10 · <b id="ftndSeverity"></b></span></div>
    <div class="ftnd-items" id="ftndItems"></div>
  </section>
  <section class="symptom-card">
    <div class="section-title"><strong>WITHDRAWAL PROFILE</strong><small>0–4</small></div>
    <div class="symptom-list" id="symptomList"></div>
  </section>
  <section class="rx-panel">
    <div class="section-title"><strong>CLINICAL PRESCRIPTION</strong><small>遊戲化對照</small></div>
    <div class="rx-grid" id="prescriptionGrid"></div>
  </section>
</aside>
<main id="main">
  <section class="workflow-card" aria-label="固定料理流程">
    <div id="workflow" data-stage="consult">
      <div class="workflow-line"></div>
      <div class="station is-active" data-stage="consult"><span class="station-icon">🩺</span><strong>01 CONSULT</strong><small>問診</small><i class="station-dot"></i></div>
      <div class="station" data-stage="prep"><span class="station-icon">🔪</span><strong>02 PREP</strong><small>備料</small><i class="station-dot"></i></div>
      <div class="station" data-stage="wok"><span class="station-icon">🍳</span><strong>03 WOK</strong><small>翻炒</small><i class="station-dot"></i></div>
      <div class="station" data-stage="serve"><span class="station-icon">🍚</span><strong>04 SERVE</strong><small>配餐</small><i class="station-dot"></i></div>
      <div id="doctorMarker" class="doctor-marker" style="left:12.5%"><img src="assets/ui/doctor-speed.webp" alt="值班醫師"></div>
    </div>
  </section>
  <section id="stagePanel" aria-live="polite"></section>
</main>
<footer id="statusBar">載入中</footer>
</div>
<script src="src/clinic-rules.js?v=r9-clean-1"></script>
<script src="src/r9-game.js?v=r9-clean-1"></script>
</body>
</html>
