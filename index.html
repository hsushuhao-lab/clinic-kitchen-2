<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Craving Kitchen R10</title>
<link rel="stylesheet" href="r10.css?v=r10-mobileflow-2">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <strong>CRAVING KITCHEN</strong>
      <small>R10 · KITCHEN REBUILD</small>
    </div>
    <div class="now-serving"><span>NOW SERVING</span><strong id="ticketNumber">001</strong></div>
  </header>

  <aside id="patientRail" aria-label="病人資訊">
    <button id="patientRailToggle" class="patient-rail-toggle" type="button" aria-expanded="false">病人資料 ▾</button>
    <section class="patient-card">
      <img id="patientPortrait" class="patient-portrait" src="" alt="">
      <div class="patient-copy">
        <small id="patientRole">CURRENT PATIENT</small>
        <h2 id="patientName">病人</h2>
      </div>
    </section>

    <section class="complaint-card">
      <small>PATIENT SAYS</small>
      <p id="patientComplaint"></p>
    </section>

    <details class="ftnd-card">
      <summary><span>FTND BASELINE</span><strong><b id="ftndScore">-</b>/10 · <i id="ftndSeverity"></i></strong></summary>
      <div id="ftndItems" class="ftnd-items"></div>
      <small>唯讀基線，不因料理改變。</small>
    </details>

    <section class="symptom-card">
      <div class="rail-head"><strong>WITHDRAWAL PROFILE</strong><small>0–4</small></div>
      <div id="symptomList" class="symptom-list"></div>
    </section>

    <section class="rx-card-panel">
      <div class="rail-head"><strong>CLINICAL PRESCRIPTION</strong><small>料理目標</small></div>
      <div id="prescriptionGrid" class="prescription-grid"></div>
    </section>
  </aside>

  <main id="gameMain">
    <section id="worldStrip" class="world-strip" aria-label="Q版醫師自動跑圖">
      <canvas id="worldCanvas"></canvas>
      <div class="station-labels" aria-hidden="true">
        <span><b>01 CONSULT</b><small>問診</small></span>
        <span><b>02 PREP</b><small>備料</small></span>
        <span><b>03 WOK</b><small>翻炒</small></span>
        <span><b>04 SERVE</b><small>配餐</small></span>
      </div>
      <div id="worldMessage" class="world-message">醫師待命</div>
    </section>

    <section id="stagePanel" class="stage-panel" aria-live="polite"></section>
  </main>

  <footer id="statusBar">R10 loading…</footer>
</div>

<script src="src/clinic-rules.js?v=r10-rebuild-1"></script>
<script src="src/r10-world.js?v=r10-mobileflow-2"></script>
<script src="src/r10-game.js?v=r10-mobileflow-2"></script>
</body>
</html>
